name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          
      - name: Build with PyInstaller
        # --onedir: 1つのディレクトリにまとめる（誤検知対策）
        # --noconsole: 黒いコンソール画面を非表示にする
        # --hidden-import vrc_sleep: 動的インポートされるvrc_sleepモジュールを明示的に含める
        run: |
          pyinstaller --name "VRCSleepNotifier" --onedir --noconsole --hidden-import vrc_sleep vrc_sleep_gui.py

      - name: Zip the build output
        run: |
          Compress-Archive -Path dist\VRCSleepNotifier -DestinationPath VRCSleepNotifier-Windows.zip

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} VRCSleepNotifier-Windows.zip --title "Release ${{ github.ref_name }}" --generate-notes
